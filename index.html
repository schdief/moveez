<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#008080">
    <meta name="description" content="Moveez - your personal movie and TV watchlist">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="styles.css?v=__BUILD__">
    <title>Moveez · manage your binge</title>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
      <symbol id="i-tv-check" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="m8.5 2.5 3.5 3.5 3.5-3.5"/><path d="m9 12.5 2 2 4-4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3.5 6.5h17v3.5a2 2 0 0 0 0 4v3.5h-17V14a2 2 0 0 0 0-4z"/><path d="M14.5 6.5v2M14.5 11v2M14.5 15.5v2"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.6" r="1.7"/><circle cx="12" cy="16.4" r="1.7"/><circle cx="7.6" cy="12" r="1.7"/><circle cx="16.4" cy="12" r="1.7"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12.5" rx="2.5"/><path d="m8.5 3 3.5 4 3.5-4"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    </svg>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="Moveez home">
          <img src="services/gui/app/views/public/logo.png" alt="" width="34" height="34">
          <span>moveez</span>
        </a>
        <nav class="tabs" aria-label="Lists">
          <button class="tab active" data-view="watchlist" aria-current="page">
            <svg class="icon"><use href="#i-bookmark"/></svg><span>Watchlist</span>
          </button>
          <button class="tab" data-view="binged">
            <svg class="icon"><use href="#i-tv-check"/></svg><span>Binged</span>
          </button>
          <button class="tab" data-view="cinema">
            <svg class="icon"><use href="#i-ticket"/></svg><span>Cinema</span>
          </button>
        </nav>
        <button class="icon-button on-brand" id="settingsButton" aria-label="Open settings">
          <svg class="icon"><use href="#i-sliders"/></svg>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <div class="page-head">
        <h1 id="viewTitle"><span id="viewName">Watchlist</span> <span class="count" id="viewCount">0</span></h1>
        <div class="page-actions">
          <button class="button ghost" id="surpriseButton"><svg class="icon"><use href="#i-sparkle"/></svg>Surprise me</button>
        </div>
      </div>

      <div class="toolbar" role="search">
        <label class="search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="Search your list or add from IMDb" aria-label="Search your list or add from IMDb" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="filters">
          <select id="typeFilter" aria-label="Filter by type">
            <option value="all">All formats</option>
            <option value="movie">Movies</option>
            <option value="series">TV series</option>
          </select>
          <select id="genreFilter" aria-label="Filter by genre"><option value="all">All genres</option></select>
          <select id="serviceFilter" aria-label="Filter by service or cinema"><option value="all">All services</option></select>
          <select id="fskFilter" aria-label="Filter by age rating">
            <option value="all">Any FSK</option>
            <option value="0">FSK 0</option>
            <option value="6">Up to FSK 6</option>
            <option value="12">Up to FSK 12</option>
            <option value="16">Up to FSK 16</option>
          </select>
          <select id="sortSelect" aria-label="Sort by"></select>
        </div>
      </div>

      <nav id="dayBar" class="day-bar" aria-label="Day" hidden></nav>

      <section id="titleGrid" class="title-grid" aria-live="polite"></section>

      <section id="suggestions" class="suggestions" aria-labelledby="suggestionsHeading" hidden>
        <h2 id="suggestionsHeading">Add from IMDb</h2>
        <p id="lookupMessage" class="hint"></p>
        <ul id="lookupResults" class="lookup-results"></ul>
      </section>
    </main>

    <div id="status" class="toast" role="status" aria-live="polite"></div>

    <dialog id="titleDialog" class="sheet tall" aria-labelledby="titleDialogHeading">
      <div class="dialog-head">
        <h2 id="titleDialogHeading">Details</h2>
        <button class="icon-button" type="button" data-close aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <div class="dialog-body">
        <div id="detailPane"></div>
      </div>
      <div class="dialog-foot" id="detailFoot" hidden>
        <button class="button primary block" id="confirmAdd" type="button">Add to watchlist</button>
      </div>
    </dialog>

    <!-- Built exactly like the add dialog (full-height sheet, no <form>), which works on the iPhone. -->
    <dialog id="settingsDialog" class="sheet tall" aria-labelledby="settingsHeading">
      <div class="dialog-head">
        <h2 id="settingsHeading">Settings</h2>
        <button class="icon-button" type="button" data-close aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <div class="dialog-body">
        <p class="hint">Everything is stored only on this device. Version <span id="appVersion"></span></p>
        <label class="field">TMDB API key
          <input id="tmdbKey" type="password" autocomplete="off" placeholder="Using the built-in key, if any">
          <small id="tmdbStatus"></small>
          <small>Streaming offers by JustWatch via TMDB, cinema programmes via kinoprogramm.com.</small>
        </label>
        <label class="field">OMDb API key
          <input id="omdbKey" type="password" autocomplete="off" placeholder="Using the built-in Moveez key">
          <small>Optional. Get your own at omdbapi.com if the shared key hits its daily limit.</small>
        </label>
        <fieldset class="field-group">
          <legend>Surprise me (optional)</legend>
          <label class="field">LLM endpoint<input id="llmEndpoint" type="url" placeholder="https://api.openai.com/v1/chat/completions"></label>
          <label class="field">LLM API key<input id="llmKey" type="password" autocomplete="off"></label>
          <label class="field">LLM model<input id="llmModel" placeholder="gpt-4o-mini"></label>
        </fieldset>
      </div>
      <div class="dialog-foot">
        <button class="button danger-text" id="clearData" type="button">Clear local data</button>
        <button class="button primary" id="saveSettings" type="button">Save settings</button>
      </div>
    </dialog>

    <script src="app.js?v=__BUILD__"></script>
  </body>
</html>
